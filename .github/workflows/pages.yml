name: Deploy Ticket Scanner V5.1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build self-contained OCR assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public/ocr/core
          mkdir -p public/ocr/lang
          mkdir -p public/src

          cp index.html manifest.webmanifest sw.js public/
          cp src/* public/src/

          curl --fail --retry 3 -L \
            https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js \
            -o public/ocr/tesseract.min.js

          curl --fail --retry 3 -L \
            https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js \
            -o public/ocr/worker.min.js

          for f in \
            tesseract-core.wasm.js \
            tesseract-core-simd.wasm.js \
            tesseract-core-lstm.wasm.js \
            tesseract-core-simd-lstm.wasm.js
          do
            curl --fail --retry 3 -L \
              "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/$f" \
              -o "public/ocr/core/$f"
          done

          for l in cat spa eng fra ita por
          do
            curl --fail --retry 3 -L \
              "https://tessdata.projectnaptha.com/4.0.0/$l.traineddata.gz" \
              -o "public/ocr/lang/$l.traineddata.gz"
          done

          test -s public/ocr/tesseract.min.js
          test -s public/ocr/worker.min.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
